name: Мой аквариум

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "main/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults"
      - "partitions.csv"
      - "dependencies.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Сборка прошивки для браузера
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32c6
          idf.py build
          python scripts/package_web_firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: browser-firmware
          path: web/firmware/
  deploy:
    needs: firmware
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Проверка страницы
        run: node --test web/tests/*.test.js
      - uses: actions/download-artifact@v4
        with:
          name: browser-firmware
          path: web/firmware
      - uses: actions/configure-pages@v5
      - name: Подготовка файлов сайта
        run: |
          mkdir -p _site
          cp web/*.html web/*.css web/*.js _site/
          cp -R web/firmware _site/firmware
          cp -R web/assets _site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
