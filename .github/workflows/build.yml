name: Сборка ESP-IDF
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Проверка хранения настроек
        run: python tests/test_settings.py
      - name: Сборка для ESP32-C6
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32c6
          idf.py build
